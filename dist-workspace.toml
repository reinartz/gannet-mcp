[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
# NOTE: aarch64-pc-windows-msvc builds on a NATIVE windows-11-arm runner
# (see [dist.github-custom-runners] below); cargo-xwin cross is incompatible
# with the ring C build-script, so xwin cross is dropped for this target.
targets = ["aarch64-apple-darwin", "aarch64-pc-windows-msvc", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Custom build setup injected right after actions/checkout, before the build
# (see .github/build-setup-wix.yml). Path is relative to .github/workflows/.
github-build-setup = "../build-setup-wix.yml"

[dist.github-custom-runners]
aarch64-pc-windows-msvc = "windows-11-arm"

# NOTE: WiX v3 is NOT installed via [dist.dependencies.chocolatey] on purpose:
# `choco install wixtoolset` alone updates the machine PATH in a way the build
# process doesn't pick up on windows-11-arm (Program Files vs Program Files
# (x86) location mismatch under x86 emulation), so candle.exe is still missing
# when dist's MSI step runs. .github/build-setup-wix.yml above handles
# install+PATH atomically (choco install, then locate candle.exe and append
# its directory to $GITHUB_PATH / set $WIX, failing fast if absent).
# windows-2022 preinstalls WiX v3; windows-11-arm does not (WiX v4+ is NOT
# supported by dist's MSI flow, which needs candle.exe + light.exe from WiX v3).
