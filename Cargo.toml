[package]
name = "gannet-mcp"
version = "0.1.0"
edition = "2021"
authors = ["Ole Reinartz"]
description = "MCP server for web searching and webpages fetching"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["mcp", "tools", "web-search", "web-fetch"]
categories = ["web-programming", "network-programming"]
homepage = "https://github.com/reinartz/gannet-mcp"
repository = "https://github.com/reinartz/gannet-mcp"
documentation = "https://docs.rs/gannet-mcp"

[lib]
name = "gannet_mcp"
path = "src/lib.rs"

[[bin]]
name = "gannet-mcp"
path = "src/main.rs"

[dependencies]
# MCP (Model Context Protocol) SDK
rmcp = { version = "3.1.0", features = [
    "server", "transport-io", "macros", "schemars",
    "transport-streamable-http-server"
] }

# HTTP server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tower-service = "0.3"
http-body-util = "0.1"

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# HTTP client
reqwest = { version = "0.13.4", features = ["json", "form", "rustls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# URL handling
url = "2.5"
urlencoding = "2.1"

# HTML parsing
scraper = "0.27.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0.19"
anyhow = "1.0"

# Environment variables
dotenv = "0.15"

# Configuration
config = "0.15.25"

# Async traits (note: hyphen, not underscore)
async-trait = "0.1"

# Futures
futures = "0.3"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Retry with backoff
backon = "1.6"

# JSON Schema derive (must match rmcp's internal version)
schemars = "1.2"

# Clap for CLI
clap = { version = "4.0", features = ["derive"] }
ddgs = "0.1.0"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.4"
tempfile = "3.10"
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
rmcp = { version = "3.1.0", features = [
    "server", "transport-io", "macros", "schemars", "client",
    "transport-streamable-http-client-reqwest"
] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
